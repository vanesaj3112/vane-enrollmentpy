{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-8 mt-10">
    <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">System Login</h2>
    <form action="{{ url_for('login') }}" method="POST">
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Username / Student ID</label>
            <input type="text" name="username" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
            <input type="password" name="password" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button type="submit" class="w-full bg-blue-900 text-white py-2 rounded-lg hover:bg-blue-800 transition">Log In</button>
    </form>
    <p class="mt-4 text-center text-sm text-gray-600">
        New Student? <a href="{{ url_for('register') }}" class="text-blue-600 font-semibold hover:underline">Register here</a>
    </p>
</div>
{% endblock %}
